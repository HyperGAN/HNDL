name: Publish to PyPI

# Publishes when a GitHub release is published. The release tag must be
# `v<version>` where <version> is the version in pyproject.toml.
#
# Authentication, in order of preference:
#   1. PyPI Trusted Publishing (no secret): register the publisher on PyPI for
#      owner HyperGAN, repository HNDL, workflow publish.yml, environment pypi.
#   2. An API token stored as the `PYPI_API_TOKEN` secret (repository level or
#      on the `pypi` environment). When the secret is set it is used instead.
#
# Run manually (workflow_dispatch) for a dry run: it builds and tests the
# distributions and keeps them as workflow artifacts without publishing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribution:
    name: Build and test distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read the package version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          print("version=" + tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
      - name: Check the release tag against the package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version v$VERSION"
            exit 1
          fi
      - run: python -m pip install "build>=1.2,<2" "twine>=6,<8" "ruff>=0.11,<1"
      - run: ruff check src tests examples scripts
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel outside the checkout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          wheel="$(ls "$PWD"/dist/*.whl)"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install "hndl[test] @ file://$wheel"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" -c "import hndl, os; assert hndl.__version__ == os.environ['VERSION'], hndl.__version__"
      - name: Test the installed wheel
        run: |
          "$RUNNER_TEMP/wheel/bin/python" -m pytest -m "not network"
          "$RUNNER_TEMP/wheel/bin/python" -m hndl.docs --check
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    if: github.event_name == 'release'
    needs: distribution
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hndl/${{ needs.distribution.outputs.version }}/
    permissions:
      id-token: write  # Trusted Publishing; unused when PYPI_API_TOKEN is set
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty when the secret is unset, which selects Trusted Publishing.
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Attestations require Trusted Publishing.
          attestations: ${{ secrets.PYPI_API_TOKEN == '' }}
          skip-existing: true
          print-hash: true

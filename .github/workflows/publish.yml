name: Publish to PyPI

# A merge to master publishes an unpublished version from pyproject.toml.
# A published GitHub release can also run the workflow using a matching tag.
#
# Authentication, in order of preference:
#   1. PyPI Trusted Publishing (no secret): register the publisher on PyPI for
#      owner HyperGAN, repository HNDL, workflow publish.yml, environment pypi.
#   2. An API token stored as the `PYPI_API_TOKEN` secret (repository level or
#      on the `pypi` environment). When the secret is set it is used instead.
#
# Run manually (workflow_dispatch) for a dry run: it builds and tests the
# distributions and keeps them as workflow artifacts without publishing.

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Resolve package version
    if: github.repository == 'HyperGAN/HNDL' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve version and check PyPI for default branch pushes
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import tomllib
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import urlopen
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          if project["name"] != "hndl" or not version or version != version.strip() or "\n" in version:
              raise SystemExit("Expected an HNDL package version")
          build = True
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              try:
                  with urlopen(f"https://pypi.org/pypi/hndl/{quote(version, safe='')}/json", timeout=15) as response:
                      published = json.load(response)
              except HTTPError as error:
                  if error.code != 404:
                      raise
              else:
                  if published["info"]["name"].lower() != "hndl":
                      raise SystemExit("PyPI returned a different project")
                  build = not published["urls"]
          print(f"version={version}")
          print(f"build={str(build).lower()}")
          PY
      - name: Check the release tag against the package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version v$VERSION"
            exit 1
          fi

  distribution:
    name: Build and test distributions
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "build>=1.2,<2" "twine>=6,<8" "ruff>=0.11,<1"
      - run: ruff check src tests examples scripts
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel outside the checkout
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          wheel="$(ls "$PWD"/dist/*.whl)"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install "hndl[test] @ file://$wheel"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" -c "import hndl, os; assert hndl.__version__ == os.environ['VERSION'], hndl.__version__"
      - name: Test the installed wheel
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" -m pytest "$GITHUB_WORKSPACE/tests" -m "not network and not benchmark"
          "$RUNNER_TEMP/wheel/bin/python" -m hndl.docs --check --out "$GITHUB_WORKSPACE/docs/operators" --networks "$GITHUB_WORKSPACE/examples/networks" --networks-out "$GITHUB_WORKSPACE/docs/networks.md"
      - name: Test the source distribution (sdist)
        run: |
          python -m venv "$RUNNER_TEMP/sdist_env"
          "$RUNNER_TEMP/sdist_env/bin/python" -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          sdist="$(ls "$PWD"/dist/*.tar.gz)"
          mkdir -p "$RUNNER_TEMP/sdist_unpack"
          tar -xzf "$sdist" -C "$RUNNER_TEMP/sdist_unpack"
          sdist_dir="$(ls -d "$RUNNER_TEMP/sdist_unpack"/hndl-*)"
          "$RUNNER_TEMP/sdist_env/bin/python" -m pip install "$sdist_dir[test]"
          cd "$sdist_dir"
          "$RUNNER_TEMP/sdist_env/bin/python" -m pytest -m "not network and not benchmark"

      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    if: github.repository == 'HyperGAN/HNDL' && github.event_name != 'workflow_dispatch'
    needs: [plan, distribution]
    runs-on: ubuntu-latest
    concurrency:
      group: pypi-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/project/hndl/${{ needs.plan.outputs.version }}/
    permissions:
      id-token: write  # Trusted Publishing; unused when PYPI_API_TOKEN is set
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty when the secret is unset, which selects Trusted Publishing.
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Attestations require Trusted Publishing.
          attestations: ${{ secrets.PYPI_API_TOKEN == '' }}
          skip-existing: true
          print-hash: true

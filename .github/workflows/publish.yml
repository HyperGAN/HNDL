name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check release tag against package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Release tag must match package version"
          PY
      - run: python -m pip install build twine ruff pytest
      - run: ruff check src tests examples
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pytest
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*

  publish:
    needs: distribution
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hndl/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

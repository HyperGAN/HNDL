name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        backend: [pure, torch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[test]'
      - if: matrix.backend == 'torch'
        run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - if: matrix.backend == 'pure'
        run: python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
      - run: python -m pytest

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine ruff
      - run: ruff check src tests
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel outside the checkout
        run: |
          python -m venv /tmp/hndl-wheel
          /tmp/hndl-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/hndl-wheel/bin/python -c "from hndl._version import __version__; assert __version__ == '0.1.0a1'"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: matrix.python == '3.11'
        run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - if: matrix.python == '3.14'
        run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -m "not network"
      - run: python -m hndl.docs --check

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine ruff
      - run: ruff check src tests examples
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel outside the checkout
        run: |
          python -m venv /tmp/hndl-wheel
          /tmp/hndl-wheel/bin/python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          /tmp/hndl-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/hndl-wheel/bin/python - <<'PY'
          import torch
          from torch import nn
          from hndl import Arg, Registry, ResolvedPlan, resolve
          from hndl.torch import network
          plan = resolve("linear(64); relu(); linear()", input_shape=("B", 128), output_shape=("B", 10))
          assert plan.nodes[-1].output_shapes["out"] == ("B", 10)
          restored = ResolvedPlan.from_json(plan.to_json())
          assert restored.semantic_digest == plan.semantic_digest
          registry = Registry.builtins()

          @registry.operator("scale", identity="example.scale", summary="Scale features.",
                             shape="x[B, ...] -> out[B, ...]", args={"gain": Arg(float, 2.0, help="Multiplier.")})
          class Scale(nn.Module):
              def __init__(self, gain):
                  super().__init__()
                  self.gain = gain

              def forward(self, x):
                  return x * self.gain

          model = network("z1, z2 = split(64); linear(z1); features = reshape(32, 4, 4); adaptive_norm(features, z2); scale()",
                          input_shape=("B", 128), output_shape=("B", 32, 4, 4), registry=registry, device="cpu")
          assert model(torch.randn(2, 128)).shape == (2, 32, 4, 4)
          print(model)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

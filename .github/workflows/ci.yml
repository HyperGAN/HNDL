name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        backend: [pure, torch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[test]'
      - if: matrix.backend == 'torch' && matrix.python == '3.11'
        run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - if: matrix.backend == 'torch' && matrix.python == '3.14'
        run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - if: matrix.backend == 'pure'
        run: python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
      - run: python -m pytest

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine ruff
      - run: ruff check src tests examples
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel outside the checkout
        run: |
          python -m venv /tmp/hndl-wheel
          /tmp/hndl-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/hndl-wheel/bin/python - <<'PY'
          import sys
          from hndl import Argument, Dim, Registry, ResolvedPlan, ShapeRule, resolve
          plan = resolve("linear(64); relu(); linear()", input_shape=("B", 128), output_shape=("B", 10))
          assert plan.nodes[-1].output_shapes["out"] == ("B", 10)
          assert "torch" not in sys.modules
          print(plan)
          settings = resolve(
              'linear(64, trainable=False); relu(); linear(init={"weight": 0, "bias": 0})',
              input_shape=("B", 128), output_shape=("B", 10),
          )
          restored = ResolvedPlan.from_json(settings.to_json())
          assert restored.schema_version == 1
          assert restored.semantic_digest == settings.semantic_digest
          assert restored.nodes[0].trainability["default"] is False
          assert restored.nodes[-1].initialization["overrides"] == {"weight": 0.0, "bias": 0.0}
          registry = Registry.builtins()
          registry.register(
              "adaptive_norm", identity="example.adaptive_norm", version=1,
              shape=ShapeRule(
                  inputs={"x": ("B", "C", "H", "W"), "params": ("B", Dim("C", scale=2))},
                  outputs={"out": ("B", "C", "H", "W")},
              ),
              arguments={"eps": Argument(float, default=1e-5, minimum=0, exclusive_minimum=True)},
              max_state_bytes=0,
          )
          plan = resolve(
              "z1, z2 = split(64); linear(z1); features = reshape(32, 4, 4); adaptive_norm(features, z2)",
              input_shape=("B", 128), output_shape=("B", 32, 4, 4), registry=registry,
          )
          restored = ResolvedPlan.from_json(plan.to_json(), registry=registry)
          assert restored.semantic_digest == plan.semantic_digest
          assert plan.nodes[1].args["out_features"] == 512
          assert "torch" not in sys.modules
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

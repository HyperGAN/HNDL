[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hndl"
version = "0.6.0"
description = "Human-readable neural network definitions with explicit shape constraints"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
authors = [{name = "HNDL contributors"}]
keywords = ["neural-network", "pytorch", "shape-inference", "configuration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.6,<3"]

[project.optional-dependencies]
pretrained = ["safetensors>=0.4", "huggingface_hub>=0.23", "transformers>=4.40", "timm>=1.0"]
test = ["pytest>=8,<10"]
docs = ["mkdocs-material>=9.5,<10", "mkdocs-gen-files>=0.5,<1", "mkdocs-literate-nav>=0.6,<1"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "twine>=6,<8", "ruff>=0.11,<1"]

[project.urls]
Homepage = "https://github.com/HyperGAN/HNDL"
Documentation = "https://hypergan.github.io/HNDL/"
Repository = "https://github.com/HyperGAN/HNDL"
Issues = "https://github.com/HyperGAN/HNDL/issues"
Specification = "https://github.com/HyperGAN/HNDL/blob/master/SPEC.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hndl = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["cuda: requires an available CUDA device", "network: downloads checkpoints from the network", "benchmark: slow performance/optimization tests, opt-in only (not run in CI by default)"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
